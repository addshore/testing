name: Gerrit clone diagnostic

on:
  workflow_dispatch:

permissions: {}

jobs:
  clone:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        environment: [ubuntu, docker]
        user-agent: [default, explicit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clone Wikibase and ParserFunctions from Gerrit
        env:
          CLONE_ENVIRONMENT: ${{ matrix.environment }}
          CLONE_USER_AGENT: ${{ matrix.user-agent }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gerrit-clone"
          if [ "$CLONE_ENVIRONMENT" = docker ]; then
            docker run --rm \
              -e CLONE_USER_AGENT \
              -v "$GITHUB_WORKSPACE/.github/scripts/gerrit-clone.sh:/diagnostic.sh:ro" \
              -v "$RUNNER_TEMP/gerrit-clone:/results" \
              docker:26.1.1 sh -c 'apk add --no-cache git curl coreutils && sh /diagnostic.sh'
          else
            sh .github/scripts/gerrit-clone.sh "$RUNNER_TEMP/gerrit-clone"
          fi
      - name: Save public HTTP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerrit-${{ matrix.environment }}-${{ matrix.user-agent }}
          path: ${{ runner.temp }}/gerrit-clone/*.log
          retention-days: 7
