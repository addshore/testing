name: macOS sudo-update permissions
on:
  push:
    branches: [codex/macos-sudo-update-smoke]
    paths:
      - source/**
      - .github/workflows/macos-sudo-update-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-sudo-update:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Run the production helper and sudo-update reproduction
        shell: bash
        working-directory: source
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          Path('../inputs').mkdir(exist_ok=True)
          Path('../inputs/plan.json').write_text(json.dumps({
              'tested_sha': sha, 'pipeline_id': 238805, 'request_id': 1002205,
          }))
          PY
          python3 tools/ci/run-github-integration.py macos-sudo-update
